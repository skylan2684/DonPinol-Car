name: Compilar APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Compilar APK
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          gradle :app:assembleRadioDebug :app:assembleTelefonoDebug --no-daemon --stacktrace

      - name: Preparar APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/radio/debug/app-radio-debug.apk out/DonPinolCar.apk
          cp app/build/outputs/apk/telefono/debug/app-telefono-debug.apk out/DonPinolCar-telefono.apk
          cd out && sha256sum DonPinolCar.apk DonPinolCar-telefono.apk | tee SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: DonPinolCar-apk
          path: out/

      - name: Publicar en Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: DonPinol Car v1.0.${{ github.run_number }}
          body: |
            APK compilado automáticamente desde el commit ${{ github.sha }}.
            - **DonPinolCar.apk**: versión completa para la radio (con música).
            - **DonPinolCar-telefono.apk**: para probar en el teléfono; no pide acceso a notificaciones, así Play Protect no la bloquea.
          files: |
            out/DonPinolCar.apk
            out/DonPinolCar-telefono.apk
            out/SHA256SUMS.txt
