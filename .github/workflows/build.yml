name: Compilar APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Compilar APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Preparar APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk out/DonPinolCar.apk
          sha256sum out/DonPinolCar.apk | tee out/DonPinolCar.apk.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: DonPinolCar-apk
          path: out/

      - name: Publicar en Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: DonPinol Car v1.0.${{ github.run_number }}
          body: |
            APK compilado automáticamente desde el commit ${{ github.sha }}.
            Descarga **DonPinolCar.apk**, pásalo a la radio e instálalo.
          files: |
            out/DonPinolCar.apk
            out/DonPinolCar.apk.sha256
