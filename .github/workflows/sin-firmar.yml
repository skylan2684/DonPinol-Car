name: Compilar APK sin firmar (DonPinol Car)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Numero de version (arriba de las versiones anteriores)
        run: echo "DP_VERSION=$((GITHUB_RUN_NUMBER + 10))" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Compilar APK de la radio sin firmar
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
          UNSIGNED: "1"
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          gradle :app:assembleRadioRelease -x lintVitalRadioRelease --no-daemon --stacktrace

      - name: Preparar APK
        run: |
          mkdir -p out
          ls app/build/outputs/apk/radio/release/
          cp app/build/outputs/apk/radio/release/app-radio-release-unsigned.apk out/DonPinolCar-unsigned.apk
          cd out && sha256sum DonPinolCar-unsigned.apk | tee SHA256SUMS.txt

      - name: Publicar en Releases (sin firmar)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ env.DP_VERSION }}
          name: DonPinol Car v1.0.${{ env.DP_VERSION }} (sin firmar)
          prerelease: true
          body: |
            APK de la radio SIN FIRMAR, compilada desde el commit ${{ github.sha }}.
            Se firma con la llave DonPinol en DonPinol-Firma; no instalar directamente.
          files: |
            out/DonPinolCar-unsigned.apk
            out/SHA256SUMS.txt
